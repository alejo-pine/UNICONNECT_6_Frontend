name: CI/CD — Uniconnect Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Tests ─────────────────────────────────────────────────
  test-dashboard:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Create .env from example
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ── Job 2: Build Docker ──────────────────────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-dashboard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            --build-arg VITE_BACKEND_PUBLIC_URL="${{ secrets.VITE_BACKEND_PUBLIC_URL }}" \
            --build-arg VITE_AUTH0_DOMAIN="${{ secrets.VITE_AUTH0_DOMAIN }}" \
            --build-arg VITE_AUTH0_CLIENT_ID="${{ secrets.VITE_AUTH0_CLIENT_ID }}" \
            --build-arg VITE_AUTH0_AUDIENCE="${{ secrets.VITE_AUTH0_AUDIENCE }}" \
            --build-arg VITE_AUTH0_CONNECTION="${{ secrets.VITE_AUTH0_CONNECTION }}" \
            --build-arg VITE_AUTH_SYNC_URL="${{ secrets.VITE_AUTH_SYNC_URL }}" \
            --build-arg VITE_AUTH_SESSION_URL="${{ secrets.VITE_AUTH_SESSION_URL }}" \
            --build-arg VITE_AUTH0_REDIRECT_URI="${{ secrets.VITE_AUTH0_REDIRECT_URI }}" \
            --build-arg VITE_CHAT_SERVICE_URL="${{ secrets.VITE_CHAT_SERVICE_URL }}" \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -t uniconnect-web:${{ github.sha }} \
            .

  # ── Job 3: Deploy a Fly.io ───────────────────────────────────────
  deploy:
    name: Deploy a Fly.io
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy a Fly.io
        run: |
          flyctl deploy --remote-only \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            --build-arg VITE_BACKEND_PUBLIC_URL="${{ secrets.VITE_BACKEND_PUBLIC_URL }}" \
            --build-arg VITE_AUTH0_DOMAIN="${{ secrets.VITE_AUTH0_DOMAIN }}" \
            --build-arg VITE_AUTH0_CLIENT_ID="${{ secrets.VITE_AUTH0_CLIENT_ID }}" \
            --build-arg VITE_AUTH0_AUDIENCE="${{ secrets.VITE_AUTH0_AUDIENCE }}" \
            --build-arg VITE_AUTH0_CONNECTION="${{ secrets.VITE_AUTH0_CONNECTION }}" \
            --build-arg VITE_AUTH_SYNC_URL="${{ secrets.VITE_AUTH_SYNC_URL }}" \
            --build-arg VITE_AUTH_SESSION_URL="${{ secrets.VITE_AUTH_SESSION_URL }}" \
            --build-arg VITE_AUTH0_REDIRECT_URI="${{ secrets.VITE_AUTH0_REDIRECT_URI }}" \
            --build-arg VITE_CHAT_SERVICE_URL="${{ secrets.VITE_CHAT_SERVICE_URL }}" \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
